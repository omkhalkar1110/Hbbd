<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Crochet Birthday Cake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- SVG Filter for Crochet Texture -->
    <svg style="width:0; height:0; position:absolute; z-index:-1;">
        <defs>
            <filter id="crochet-filter">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- Floating Background Hearts -->
    <div class="floating-hearts">
        <div class="heart" style="left: 10%; animation-duration: 6s; animation-delay: 0s;">💖</div>
        <div class="heart" style="left: 30%; animation-duration: 5s; animation-delay: 2s;">💕</div>
        <div class="heart" style="left: 50%; animation-duration: 7s; animation-delay: 1s;">💞</div>
        <div class="heart" style="left: 70%; animation-duration: 6s; animation-delay: 3s;">💓</div>
        <div class="heart" style="left: 90%; animation-duration: 5s; animation-delay: 0.5s;">💘</div>
    </div>

    <!-- Custom Modal for Annoying Messages -->
    <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-pink-200/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl p-[clamp(1.5rem,5vw,2rem)] max-w-[90vw] sm:max-w-sm w-full transform scale-95 transition-transform duration-300 flex flex-col items-center text-center stitched-border crochet-texture" id="modal-content">
            <h2 id="modal-text" class="text-[clamp(1.25rem,6vw,1.5rem)] font-bold text-pink-600 mb-6 font-heading">Wait!</h2>
            <button onclick="nextMessage()" class="bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-8 rounded-xl shadow-md active:scale-95 transition-transform border-2 border-dashed border-white">
                OK...
            </button>
        </div>
    </div>

    <!-- Surprise Gift Box Section -->
    <div id="surprise-section" class="fixed inset-0 z-[90] flex flex-col items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-700 translate-y-10">
        <div id="gift-box" class="cursor-pointer group perspective-1000 relative" onclick="openGift()">
            <!-- Closed Box -->
            <div id="box-closed" class="w-[clamp(10rem,40vw,12rem)] aspect-square bg-[#ff9aa2] rounded-xl flex items-center justify-center stitched-border crochet-texture shadow-2xl transition-all duration-500 transform group-hover:scale-105 group-hover:-rotate-3">
                <div class="absolute w-full h-6 bg-white opacity-80 top-1/2 -translate-y-1/2 border-y-2 border-dashed border-pink-300"></div>
                <div class="absolute h-full w-6 bg-white opacity-80 left-1/2 -translate-x-1/2 border-x-2 border-dashed border-pink-300"></div>
                <div class="absolute -top-6 text-[clamp(2.5rem,8vw,3rem)]">🎀</div>
                <p class="absolute bottom-2 text-white font-bold text-sm bg-pink-500/50 px-2 rounded-full whitespace-nowrap">Tap to open!</p>
            </div>
            
            <!-- Opened Box Message -->
            <div id="box-opened" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[clamp(14rem,85vw,18rem)] bg-white rounded-2xl p-[clamp(1rem,4vw,1.5rem)] shadow-2xl stitched-border crochet-texture text-center transform scale-0 transition-transform duration-500">
                <h3 class="text-[clamp(1.2rem,6vw,1.5rem)] text-pink-600 font-heading mb-3">Here is your gift! 🎁</h3>
                <p class="text-gray-700 font-bold mb-4 text-[clamp(0.85rem,3.5vw,1rem)]">Just kidding.<br>Awesome person don't need gift 🥳! ✨</p>
                <p class="text-pink-400 font-bold text-[clamp(1rem,4vw,1.125rem)]">Happy Birthday!!</p>
            </div>
        </div>
    </div>

    <!-- Main Card container -->
    <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-[clamp(1.5rem,5vw,2.5rem)] w-[95vw] max-w-lg text-center relative overflow-visible stitched-border crochet-texture flex flex-col items-center">
        
        <h1 class="text-[clamp(1.8rem,8vw,3rem)] text-pink-600 mb-2 drop-shadow-sm font-heading leading-tight">
            Happy Birthday, <br><span id="name-display" class="text-[clamp(1.5rem,6vw,2.5rem)] text-pink-500 font-extrabold block mt-1">Dipti ❤️✨</span>
        </h1>
        <p class="text-pink-500/90 mb-[clamp(1.5rem,5vw,2.5rem)] font-bold text-[clamp(0.9rem,3vw,1.125rem)]">Make a wish and tap the candle!</p>

        <!-- Cake & Candle Scene Container -->
        <div class="w-full flex justify-center mb-6 sm:mb-10">
            <div class="relative w-64 h-64" style="transform: scale(clamp(0.6, 75vw / 350, 1)); transform-origin: center bottom;">
                
                <!-- Candle (Stays in the middle) -->
                <div id="candle" class="absolute bottom-[130px] left-1/2 transform -translate-x-1/2 z-20 flex flex-col items-center cursor-pointer group crochet-texture" onclick="blowOutCandle()">
                    <!-- Flame -->
                    <div id="flame" class="w-4 h-8 bg-yellow-400 flame transition-opacity duration-300"></div>
                    <!-- Smoke container (hidden initially) -->
                    <div id="smoke-container"></div>
                    <!-- Wick -->
                    <div class="w-1 h-3 bg-gray-700"></div>
                    <!-- Body -->
                    <div class="w-5 h-16 bg-gradient-to-r from-blue-200 via-blue-400 to-blue-200 border-2 border-dashed border-white rounded-sm shadow-inner group-hover:scale-105 transition-transform">
                        <div class="w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9InRyYW5zcGFyZW50Ii8+PGxpbmUgeDE9IjAiIHkxPSI0IiB4Mj0iNCIgeTI9IjAiIHN0cm9rZT0icmdiYSgyNTUsMjU1LDI1NSwwLjUpIiBzdHJva2Utd2lkdGg9IjEiLz48L3N2Zz4=')] opacity-50"></div>
                    </div>
                </div>

                <!-- Cake Wrapper -->
                <div id="cake-wrapper" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 w-60 h-32 z-10 crochet-texture">
                    
                    <!-- Left Half -->
                    <div id="left-half" class="absolute inset-0 transition-transform duration-1000 origin-bottom-right" style="clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); z-index: 2;">
                        <div class="w-full h-full relative rounded-t-xl rounded-b-md overflow-hidden bg-[#ff9aa2] border-4 border-dashed border-white/50">
                            <div class="absolute bottom-6 w-full h-4 bg-[#ff7b89]"></div>
                            <div class="absolute bottom-16 w-full h-4 bg-[#ff7b89]"></div>
                            <div class="absolute top-0 w-full h-6 bg-[#fff0f3]"></div>
                            <!-- Drips -->
                            <div class="absolute top-5 left-3 w-5 h-9 bg-[#fff0f3] drip"></div>
                            <div class="absolute top-5 left-12 w-4 h-12 bg-[#fff0f3] drip"></div>
                            <div class="absolute top-5 left-24 w-6 h-7 bg-[#fff0f3] drip"></div>
                            <!-- Sprinkles -->
                            <div class="absolute top-2 left-6 w-3 h-1.5 bg-pink-400 rounded-full rotate-45 border border-white"></div>
                            <div class="absolute top-3 left-16 w-3 h-1.5 bg-blue-400 rounded-full -rotate-12 border border-white"></div>
                            <div class="absolute top-1.5 left-24 w-3 h-1.5 bg-yellow-400 rounded-full rotate-90 border border-white"></div>
                        </div>
                    </div>

                    <!-- Right Half -->
                    <div id="right-half" class="absolute inset-0 transition-transform duration-1000 origin-bottom-left" style="clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); z-index: 1;">
                        <div class="w-full h-full relative rounded-t-xl rounded-b-md overflow-hidden bg-[#ff9aa2] border-4 border-dashed border-white/50">
                            <div class="absolute bottom-6 w-full h-4 bg-[#ff7b89]"></div>
                            <div class="absolute bottom-16 w-full h-4 bg-[#ff7b89]"></div>
                            <div class="absolute top-0 w-full h-6 bg-[#fff0f3]"></div>
                            <!-- Drips -->
                            <div class="absolute top-5 right-24 w-5 h-10 bg-[#fff0f3] drip"></div>
                            <div class="absolute top-5 right-12 w-4 h-6 bg-[#fff0f3] drip"></div>
                            <div class="absolute top-5 right-4 w-6 h-11 bg-[#fff0f3] drip"></div>
                            <!-- Sprinkles -->
                            <div class="absolute top-3 right-14 w-3 h-1.5 bg-purple-400 rounded-full rotate-12 border border-white"></div>
                            <div class="absolute top-2 right-24 w-3 h-1.5 bg-green-400 rounded-full -rotate-45 border border-white"></div>
                            <div class="absolute top-3 right-6 w-3 h-1.5 bg-red-400 rounded-full rotate-45 border border-white"></div>
                        </div>
                    </div>

                </div>

                <!-- Plate -->
                <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-72 h-8 bg-white/80 rounded-[50%] shadow-lg border-2 border-dashed border-pink-300 z-0 crochet-texture"></div>
            </div>
        </div>

        <!-- Controls & Message -->
        <div class="flex flex-col gap-[clamp(0.75rem,2vw,1rem)] w-full max-w-xs mx-auto z-40 relative mt-2">
            
            <p class="text-pink-500 font-bold text-[clamp(1rem,4vw,1.15rem)] mb-2 italic px-2">
                "Best wishes from someone who thinks you are amazing! ✨"
            </p>
            
            <div class="flex gap-2">
                <button 
                    id="cut-btn"
                    onclick="startCutSequence(event)" 
                    onmouseover="dodgeButton(event)"
                    ontouchstart="dodgeButton(event)"
                    class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-[clamp(0.5rem,2vw,1rem)] rounded-xl shadow-lg transition-all z-50 relative border-2 border-dashed border-white crochet-texture whitespace-nowrap text-[clamp(0.85rem,3.5vw,1rem)]"
                >
                    🔪 Cut Cake
                </button>
                <button 
                    onclick="shareLink()" 
                    class="flex-1 bg-indigo-400 hover:bg-indigo-500 text-white font-bold py-3 px-[clamp(0.5rem,2vw,1rem)] rounded-xl shadow-lg transform hover:-translate-y-1 transition-all active:scale-95 flex items-center justify-center gap-1 border-2 border-dashed border-white crochet-texture whitespace-nowrap text-[clamp(0.85rem,3.5vw,1rem)]"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                    </svg>
                    Share
                </button>
            </div>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 font-bold text-sm border-2 border-dashed border-gray-500">
        Link copied to clipboard!
    </div>

    <script src="script.js"></script>
</body>
  </html>
